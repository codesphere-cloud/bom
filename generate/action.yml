name: bom generate
description: Generate Helm chart BOMs inside GitHub Actions.
inputs:
  include-paths:
    description: Newline-separated chart paths to include for generate mode. Glob patterns are supported.
    required: false
    default: ""
  exclude-paths:
    description: Newline-separated chart paths to exclude from generate mode. Glob patterns are supported.
    required: false
    default: ""
  changed-only:
    description: Restrict processing to charts changed in the current push or pull request.
    required: false
    default: "false"
  sbom:
    description: Generate CycloneDX and SPDX JSON SBOMs with Trivy for every referenced image.
    required: false
    default: "false"
  cosign:
    description: Attest each generated image SBOM using keyless Cosign signing.
    required: false
    default: "false"
  force:
    description: Regenerate image SBOMs and upload attestations even when they already exist.
    required: false
    default: "false"
  debug:
    description: Enable debug logging and pass --debug through to bom generate.
    required: false
    default: "false"
  format:
    description: Output format used for generated BOM files.
    required: false
    default: csbom-v2-json
  release-name:
    description: Optional Helm release name override.
    required: false
    default: ""
  namespace:
    description: Helm namespace used for generation.
    required: false
    default: default
  validate-configured-image-exists:
    description: Fail when configured additional images do not resolve.
    required: false
    default: "false"
  fail-on-no-matches:
    description: Fail instead of succeeding when no paths match the configured filters.
    required: false
    default: "false"
outputs:
  changed-paths:
    description: Newline-separated changed paths considered by the action.
    value: ${{ steps.run.outputs['changed-paths'] }}
  matched-paths:
    description: Newline-separated chart paths selected after filtering.
    value: ${{ steps.run.outputs['matched-paths'] }}
  processed-paths:
    description: Newline-separated generated BOM file paths.
    value: ${{ steps.run.outputs['processed-paths'] }}
  changed-output-paths:
    description: Newline-separated generated BOM paths whose contents changed during this run.
    value: ${{ steps.run.outputs['changed-output-paths'] }}
  changed-target-paths:
    description: Newline-separated chart paths whose generated BOM contents changed during this run.
    value: ${{ steps.run.outputs['changed-target-paths'] }}
  any-processed-changed:
    description: Whether any generated BOM output changed during this run.
    value: ${{ steps.run.outputs['any-processed-changed'] }}
runs:
  using: composite
  steps:
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

    - name: Set up Trivy
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      env:
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        TRIVY_VERSION: v0.76.0
      run: |
        # The upstream installer uses get.trivy.dev, which can fail DNS lookup.
        # Download the same release directly and retain checksum verification.
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) arch=64bit ;;
          Linux/ARM64) arch=ARM64 ;;
          *) echo "unsupported Trivy runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        version="${TRIVY_VERSION#v}"
        archive="trivy_${version}_Linux-${arch}.tar.gz"
        checksums="trivy_${version}_checksums.txt"
        base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
        tmp_dir=$(mktemp -d)
        trap 'rm -rf "$tmp_dir"' EXIT
        for file in "$archive" "$checksums"; do
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            "$base/$file" --output "$tmp_dir/$file"
        done
        (
          cd "$tmp_dir"
          awk -v archive="$archive" '$2 == archive {print}' "$checksums" > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar --no-same-owner -xzf "$archive" trivy
        )
        binary_dir="$RUNNER_TEMP/bom-trivy"
        mkdir -p "$binary_dir"
        install -m 0755 "$tmp_dir/trivy" "$binary_dir/trivy"
        echo "$binary_dir" >> "$GITHUB_PATH"
        "$binary_dir/trivy" --version

    - name: Set up Cosign
      if: ${{ inputs.cosign == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - id: resolve-binary
      name: Resolve bom action binary
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      working-directory: ${{ github.action_path }}/..
      run: |
        case "$RUNNER_OS_NAME" in
          Linux) goos=linux ;;
          *)
            echo "unsupported runner.os: $RUNNER_OS_NAME" >&2
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH_NAME" in
          X64) goarch=amd64 ;;
          ARM64) goarch=arm64 ;;
          *)
            echo "unsupported runner.arch: $RUNNER_ARCH_NAME" >&2
            exit 1
            ;;
        esac

        binary_path="${{ github.action_path }}/../dist/${goos}-${goarch}/bom-action"
        if [ ! -f "$binary_path" ]; then
          echo "missing prebuilt action binary: $binary_path" >&2
          exit 1
        fi

        chmod +x "$binary_path"
        echo "binary-path=$binary_path" >> "$GITHUB_OUTPUT"

    - id: run
      name: Run bom generate action
      shell: bash
      env:
        INPUT_INCLUDE_PATHS: ${{ inputs.include-paths }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_CHANGED_ONLY: ${{ inputs.changed-only }}
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_COSIGN: ${{ inputs.cosign }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_RELEASE_NAME: ${{ inputs.release-name }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_VALIDATE_CONFIGURED_IMAGE_EXISTS: ${{ inputs.validate-configured-image-exists }}
        INPUT_FAIL_ON_NO_MATCHES: ${{ inputs.fail-on-no-matches }}
      run: |
        "${{ steps.resolve-binary.outputs.binary-path }}" \
          generate \
          --include-paths="$INPUT_INCLUDE_PATHS" \
          --exclude-paths="$INPUT_EXCLUDE_PATHS" \
          --changed-only="$INPUT_CHANGED_ONLY" \
          --sbom="$INPUT_SBOM" \
          --cosign="$INPUT_COSIGN" \
          --force="$INPUT_FORCE" \
          --debug="$INPUT_DEBUG" \
          --format="$INPUT_FORMAT" \
          --release-name="$INPUT_RELEASE_NAME" \
          --namespace="$INPUT_NAMESPACE" \
          --validate-configured-image-exists="$INPUT_VALIDATE_CONFIGURED_IMAGE_EXISTS" \
          --fail-on-no-matches="$INPUT_FAIL_ON_NO_MATCHES"
