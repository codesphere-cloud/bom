name: bom check
description: Validate generated BOM files against upstream registries inside GitHub Actions.
inputs:
  include-paths:
    description: Newline-separated BOM file or directory paths to include for check mode. Glob patterns are supported.
    required: false
    default: ""
  bom-paths:
    description: Alias for include-paths. Used only when include-paths is empty.
    required: false
    default: ""
  exclude-paths:
    description: Newline-separated BOM file or directory paths to exclude from check mode. Glob patterns are supported.
    required: false
    default: ""
  changed-only:
    description: Restrict processing to BOM files changed in the current push or pull request.
    required: false
    default: "false"
  debug:
    description: Enable debug logging and pass --debug through to bom check.
    required: false
    default: "false"
  format:
    description: Check summary format. Supported values are table and yaml.
    required: false
    default: table
  fail-on-no-matches:
    description: Fail instead of succeeding when no paths match the configured filters.
    required: false
    default: "false"
outputs:
  changed-boms:
    description: Newline-separated changed BOMs considered by the action.
    value: ${{ steps.run.outputs['changed-boms'] }}
  matched-boms:
    description: Newline-separated BOMs selected after filtering.
    value: ${{ steps.run.outputs['matched-boms'] }}
  processed-boms:
    description: Newline-separated checked BOMs.
    value: ${{ steps.run.outputs['processed-boms'] }}
  failed-boms:
    description: Newline-separated BOMs that failed validation.
    value: ${{ steps.run.outputs['failed-boms'] }}
runs:
  using: composite
  steps:
    - id: resolve-binary
      name: Resolve bom action binary
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        case "$RUNNER_OS_NAME" in
          Linux) goos=linux ;;
          *)
            echo "unsupported runner.os: $RUNNER_OS_NAME" >&2
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH_NAME" in
          X64) goarch=amd64 ;;
          ARM64) goarch=arm64 ;;
          *)
            echo "unsupported runner.arch: $RUNNER_ARCH_NAME" >&2
            exit 1
            ;;
        esac

        binary_path="${{ github.action_path }}/../dist/${goos}-${goarch}/bom-action"
        if [ ! -f "$binary_path" ]; then
          echo "missing prebuilt action binary: $binary_path" >&2
          exit 1
        fi

        chmod +x "$binary_path"
        echo "binary-path=$binary_path" >> "$GITHUB_OUTPUT"

    - id: run
      name: Run bom check action
      shell: bash
      env:
        INPUT_INCLUDE_PATHS: ${{ inputs['include-paths'] || inputs['bom-paths'] }}
        INPUT_EXCLUDE_PATHS: ${{ inputs['exclude-paths'] }}
        INPUT_CHANGED_ONLY: ${{ inputs['changed-only'] }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_SUMMARY_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON_NO_MATCHES: ${{ inputs['fail-on-no-matches'] }}
      run: |
        "${{ steps.resolve-binary.outputs.binary-path }}" \
          check \
          --include-paths="$INPUT_INCLUDE_PATHS" \
          --exclude-paths="$INPUT_EXCLUDE_PATHS" \
          --changed-only="$INPUT_CHANGED_ONLY" \
          --debug="$INPUT_DEBUG" \
          --format="$INPUT_SUMMARY_FORMAT" \
          --fail-on-no-matches="$INPUT_FAIL_ON_NO_MATCHES"
