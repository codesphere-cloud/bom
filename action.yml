name: helm-bom
description: Generate Helm chart BOMs or validate BOM image references inside GitHub Actions.
inputs:
  mode:
    description: 'Action mode: generate or check.'
    required: true
  paths:
    description: Newline-separated chart paths for generate mode or BOM file or directory paths for check mode. Glob patterns are supported.
    required: false
    default: ""
  changed-only:
    description: Restrict processing to paths changed in the current push or pull request.
    required: false
    default: "false"
  debug:
    description: Enable debug logging and pass --debug through to helm-bom subcommands.
    required: false
    default: "false"
  format:
    description: Output format used in generate mode.
    required: false
    default: csbom-yaml
  release-name:
    description: Optional Helm release name override for generate mode.
    required: false
    default: ""
  namespace:
    description: Helm namespace used for generate mode.
    required: false
    default: default
  validate-configured-image-exists:
    description: Fail generate mode when configured additional images do not resolve.
    required: false
    default: "false"
  registry-server:
    description: Optional registry server to log in to before running checks.
    required: false
    default: ""
  registry-username:
    description: Optional registry username used with registry-server.
    required: false
    default: ""
  registry-password:
    description: Optional registry password used with registry-server.
    required: false
    default: ""
  fail-on-no-matches:
    description: Fail instead of succeeding when no paths match the configured filters.
    required: false
    default: "false"
outputs:
  changed-paths:
    description: Newline-separated changed paths considered by the action.
    value: ${{ steps.run.outputs['changed-paths'] }}
  matched-paths:
    description: Newline-separated chart or BOM paths selected after filtering.
    value: ${{ steps.run.outputs['matched-paths'] }}
  processed-paths:
    description: Newline-separated generated BOM files or checked BOM paths.
    value: ${{ steps.run.outputs['processed-paths'] }}
  changed-output-paths:
    description: Newline-separated generated BOM paths whose contents changed during this run.
    value: ${{ steps.run.outputs['changed-output-paths'] }}
  changed-target-paths:
    description: Newline-separated chart paths whose generated BOM contents changed during this run.
    value: ${{ steps.run.outputs['changed-target-paths'] }}
  any-processed-changed:
    description: Whether any generated BOM output changed during this run.
    value: ${{ steps.run.outputs['any-processed-changed'] }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: true
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - uses: azure/setup-helm@v5

    - name: Build helm-bom action binary
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/helm-bom-action" ./cmd/helm-bom-action

    - id: run
      name: Run helm-bom action
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CHANGED_ONLY: ${{ inputs.changed-only }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_RELEASE_NAME: ${{ inputs.release-name }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_VALIDATE_CONFIGURED_IMAGE_EXISTS: ${{ inputs.validate-configured-image-exists }}
        INPUT_REGISTRY_SERVER: ${{ inputs.registry-server }}
        INPUT_REGISTRY_USERNAME: ${{ inputs.registry-username }}
        INPUT_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        INPUT_FAIL_ON_NO_MATCHES: ${{ inputs.fail-on-no-matches }}
      run: |
        "$RUNNER_TEMP/helm-bom-action" \
          --mode="$INPUT_MODE" \
          --paths="$INPUT_PATHS" \
          --changed-only="$INPUT_CHANGED_ONLY" \
          --debug="$INPUT_DEBUG" \
          --format="$INPUT_FORMAT" \
          --release-name="$INPUT_RELEASE_NAME" \
          --namespace="$INPUT_NAMESPACE" \
          --validate-configured-image-exists="$INPUT_VALIDATE_CONFIGURED_IMAGE_EXISTS" \
          --registry-server="$INPUT_REGISTRY_SERVER" \
          --registry-username="$INPUT_REGISTRY_USERNAME" \
          --registry-password="$INPUT_REGISTRY_PASSWORD" \
          --fail-on-no-matches="$INPUT_FAIL_ON_NO_MATCHES"
