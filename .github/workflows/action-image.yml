name: Action Image

on:
  pull_request:
    paths:
      - Dockerfile
      - action.yml
      - cmd/helm-bom-action/**
      - cmd/helm-bom/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/action-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - action.yml
      - cmd/helm-bom-action/**
      - cmd/helm-bom/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/action-image.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
