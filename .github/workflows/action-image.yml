name: Action Image

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:main

      - if: github.ref == 'refs/heads/main'
        name: Update action image ref
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_ref="docker://ghcr.io/${{ github.repository }}@${IMAGE_DIGEST}"
          sed -i "s|^  image: docker://.*$|  image: ${image_ref}|" action.yml

      - if: github.ref == 'refs/heads/main'
        name: Commit updated action image ref
        run: |
          if git diff --quiet -- action.yml; then
            echo "action.yml already references the pushed image"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "chore: update action image digest [skip ci]"
          git push
