name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v5

      - name: Check Required Tools
        run: make check-tools

      - name: Build
        run: make build

      - name: Unit And Package Tests
        run: make test

      - name: End-to-End Test
        run: make test-e2e

      - name: Build Action Container
        run: docker build -t helm-bom-action .

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Action Container
        run: docker build -t helm-bom-action .

      - name: Run Generate Mode In Container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            helm-bom-action \
            --mode=generate \
            --paths=testdata/charts/* \
            --changed-only=false

      - name: Verify Generated BOM
        run: test -f testdata/charts/e2e/bom.json
